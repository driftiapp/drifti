name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Validate environment variables
        run: npm run test:env
        env:
          PORT: 3000
          NODE_ENV: test
          WS_PORT: 8080
          WS_PATH: /ws
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: 1h
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DB: 0
          METRICS_ENABLED: true
          METRICS_PORT: 9100
          METRICS_PATH: /metrics
          REACT_APP_API_URL: http://localhost:3000/api
          REACT_APP_WS_URL: ws://localhost:8080/ws
          REACT_APP_ENV: test
          PRESENCE_ACTIVITY_TIMEOUT: 300000
          PRESENCE_CLEANUP_INTERVAL: 30000
          PRESENCE_MAX_ROOMS_PER_USER: 5
          PRESENCE_MAX_USERS_PER_ROOM: 100
          LOG_LEVEL: info
          LOG_FORMAT: json
          LOG_FILE: logs/app.log
          CORS_ORIGIN: http://localhost:3000
          RATE_LIMIT_WINDOW: 15
          RATE_LIMIT_MAX: 100
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: driftix_test
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

  test:
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: driftix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test
        env:
          PORT: 3000
          NODE_ENV: test
          WS_PORT: 8080
          WS_PATH: /ws
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: 1h
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DB: 0
          METRICS_ENABLED: true
          METRICS_PORT: 9100
          METRICS_PATH: /metrics
          REACT_APP_API_URL: http://localhost:3000/api
          REACT_APP_WS_URL: ws://localhost:8080/ws
          REACT_APP_ENV: test
          PRESENCE_ACTIVITY_TIMEOUT: 300000
          PRESENCE_CLEANUP_INTERVAL: 30000
          PRESENCE_MAX_ROOMS_PER_USER: 5
          PRESENCE_MAX_USERS_PER_ROOM: 100
          LOG_LEVEL: info
          LOG_FORMAT: json
          LOG_FILE: logs/app.log
          CORS_ORIGIN: http://localhost:3000
          RATE_LIMIT_WINDOW: 15
          RATE_LIMIT_MAX: 100
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: driftix_test
          DB_USER: postgres
          DB_PASSWORD: postgres 