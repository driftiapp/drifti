<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="1200" height="600" fill="url(#gradient)" />
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E40AF" />
      <stop offset="1" stop-color="#3B82F6" />
    </linearGradient>
    
    <!-- Glow effect for logo -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Button hover effects -->
    <filter id="buttonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- City Skyline -->
  <path d="M0 400 L100 350 L200 380 L300 320 L400 360 L500 300 L600 340 L700 280 L800 320 L900 260 L1000 300 L1100 240 L1200 280 L1200 600 L0 600 Z" fill="#0F172A" opacity="0.8" />

  <!-- Road -->
  <rect x="0" y="500" width="1200" height="100" fill="#1E293B" />

  <!-- Road Lines -->
  <rect x="0" y="550" width="1200" height="10" fill="#3B82F6" opacity="0.5" />

  <!-- Animated Car -->
  <g class="hero-car">
    <rect x="400" y="450" width="120" height="40" rx="5" fill="#F43F5E" />
    <rect x="380" y="470" width="160" height="20" rx="5" fill="#F43F5E" />
    <circle cx="420" cy="490" r="15" fill="#1E293B" />
    <circle cx="500" cy="490" r="15" fill="#1E293B" />
    <!-- Car headlights -->
    <circle cx="380" cy="470" r="8" fill="#FEF08A" opacity="0.8" />
  </g>

  <!-- Animated Delivery Bike -->
  <g class="hero-bike">
    <circle cx="800" cy="480" r="20" fill="#1E293B" />
    <circle cx="900" cy="480" r="20" fill="#1E293B" />
    <rect x="800" y="460" width="100" height="20" rx="5" fill="#10B981" />
    <rect x="850" y="440" width="30" height="20" rx="5" fill="#10B981" />
    <!-- Bike headlight -->
    <circle cx="800" cy="460" r="6" fill="#FEF08A" opacity="0.8" />
  </g>

  <!-- Animated Stars -->
  <g>
    <circle cx="100" cy="100" r="2" fill="white" class="hero-star" style="--star-index: 0" />
    <circle cx="200" cy="150" r="2" fill="white" class="hero-star" style="--star-index: 1" />
    <circle cx="300" cy="80" r="2" fill="white" class="hero-star" style="--star-index: 2" />
    <circle cx="400" cy="120" r="2" fill="white" class="hero-star" style="--star-index: 3" />
    <circle cx="500" cy="90" r="2" fill="white" class="hero-star" style="--star-index: 4" />
    <circle cx="600" cy="130" r="2" fill="white" class="hero-star" style="--star-index: 5" />
    <circle cx="700" cy="110" r="2" fill="white" class="hero-star" style="--star-index: 6" />
    <circle cx="800" cy="140" r="2" fill="white" class="hero-star" style="--star-index: 7" />
    <circle cx="900" cy="100" r="2" fill="white" class="hero-star" style="--star-index: 8" />
    <circle cx="1000" cy="120" r="2" fill="white" class="hero-star" style="--star-index: 9" />
    <circle cx="1100" cy="90" r="2" fill="white" class="hero-star" style="--star-index: 10" />
  </g>

  <!-- Animated Logo Text -->
  <g class="hero-logo">
    <text x="600" y="200" font-family="Arial" font-size="48" font-weight="bold" fill="white" text-anchor="middle" filter="url(#glow)">DRIFTI</text>
    <text x="600" y="250" font-family="Arial" font-size="24" fill="white" text-anchor="middle" filter="url(#glow)">Rides & Delivery</text>
  </g>

  <!-- Interactive Ride Button -->
  <g class="ride-button" role="button" tabindex="0">
    <rect x="100" y="300" width="200" height="100" rx="10" fill="#1E293B" opacity="0.8" />
    <text x="200" y="350" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Ride Now</text>
    <!-- Car icon -->
    <rect x="150" y="320" width="40" height="20" rx="5" fill="#F43F5E" />
    <circle cx="160" cy="340" r="8" fill="#1E293B" />
    <circle cx="180" cy="340" r="8" fill="#1E293B" />
  </g>
  
  <!-- Interactive Delivery Button -->
  <g class="delivery-button" role="button" tabindex="0">
    <rect x="900" y="300" width="200" height="100" rx="10" fill="#1E293B" opacity="0.8" />
    <text x="1000" y="350" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Order Delivery</text>
    <!-- Bike icon -->
    <circle cx="930" cy="330" r="10" fill="#10B981" />
    <circle cx="970" cy="330" r="10" fill="#10B981" />
    <rect x="930" y="320" width="40" height="10" rx="5" fill="#10B981" />
  </g>

  <!-- Join Us Floating Icon -->
  <g class="join-us-icon" role="button" tabindex="0">
    <circle cx="1100" cy="100" r="30" fill="#3B82F6" opacity="0.8" />
    <text x="1100" y="105" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Join Us</text>
  </g>
</svg> 